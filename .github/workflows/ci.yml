name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and check for sorry
    runs-on: ubuntu-latest
    env:
      # Caps the Lean worker count, and with it the peak resident set. Lake has
      # no job limit of its own: it registers build jobs as Lean tasks and the
      # runtime's task pool, sized by this variable, decides how many run.
      LEAN_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: lake-

      - name: Fetch prebuilt Mathlib
        # Mathlib is 8245 modules; the community oleans are downloaded rather
        # than compiled. The other two git dependencies are small enough to
        # build from source — catcryptCore is 247 modules and hax-lean is one.
        # `|| true` so a cache-server hiccup falls back to a source build
        # instead of failing the run.
        run: lake exe cache get || true

      - name: Build
        # Wrapped by the gate, which records the build's diagnostics for the
        # check below and propagates the build's own exit status.
        run: scripts/sorry-gate.sh run lake build CatCrypt.Crypto.EasyCryptImport.All

      - name: Check for sorry
        # The gate reads Lean's `hasSorry` diagnostic out of the build log and
        # ratchets it against scripts/sorry-baseline.txt. A declaration whose
        # proof term reaches `sorryAx` produces that diagnostic even when the
        # word appears nowhere in the source, and a `sorry` in a comment or a
        # docstring produces none, which is why the check reads the compiler
        # rather than the sources.
        run: scripts/sorry-gate.sh check

      - name: Baseline is committed
        # The gate rewrites the baseline downward when a count falls. An
        # uncommitted rewrite means the run tightened the ratchet and the
        # tightening was never recorded.
        run: git diff --exit-code scripts/sorry-baseline.txt
